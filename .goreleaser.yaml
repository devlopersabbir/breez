version: 2
project_name: breez

before:
  hooks:
    - go mod tidy

builds:
  - id: breez-cli
    main: ./cmd/breez
    binary: breez
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/devlopersabbir/breez/internal/version.Version={{.Version}} -X github.com/devlopersabbir/breez/internal/version.Commit={{.Commit}} -X github.com/devlopersabbir/breez/internal/version.BuildDate={{.Date}}

  - id: breez-gateway
    main: ./cmd/gateway
    binary: breez-gateway
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/devlopersabbir/breez/internal/version.Version={{.Version}} -X github.com/devlopersabbir/breez/internal/version.Commit={{.Commit}} -X github.com/devlopersabbir/breez/internal/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: devlopersabbir
    name: breez
  mode: keep_existing

changelog:
  use: github
