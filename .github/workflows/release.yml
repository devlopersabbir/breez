name: Auto Release & Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Auto Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Bump version and push tag
        id: auto_tag
        run: |
          # Fetch all tags from remote
          git fetch --tags

          # Get latest tag or default to v1.0.0
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            # Extract major, minor, patch
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)

            # Increment patch
            PATCH=$((PATCH + 1))

            # If patch reaches 100, reset patch to 0 and increment minor
            if [ $PATCH -ge 100 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi

            # If minor reaches 100, reset minor to 0 and increment major
            if [ $MINOR -ge 100 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Check if manual tag already exists on current commit
          EXISTS=$(git tag --points-at HEAD)
          if [ -n "$EXISTS" ]; then
            echo "Manual tag found on commit: $EXISTS"
            echo "tag=$EXISTS" >> $GITHUB_OUTPUT
          else
            echo "Auto-generated new tag: $NEW_TAG"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Extract Full CHANGELOG Notes
        id: changelog_notes
        run: |
          TAG="${{ steps.auto_tag.outputs.tag }}"
          python3 -c "
          import re

          tag = '$TAG'.lstrip('v')
          content = open('CHANGELOG.md').read()

          # Try matching specific version section first
          pattern = r'## \[(?:v?' + re.escape(tag) + r'|Unreleased)\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if match and match.group(1).strip():
              notes = match.group(1).strip()
          else:
              # Fallback: Use full CHANGELOG.md content (excluding main title)
              lines = content.splitlines()
              notes = '\n'.join(lines[2:]).strip() if len(lines) > 2 else content.strip()

          with open('/tmp/release_notes.md', 'w') as f:
              f.write(notes)
          "
          echo "Full release notes prepared in /tmp/release_notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=/tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
